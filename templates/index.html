        // ================================================================

        function updateTickerBar(pane, price, change, changePct, volume) {
            const sym = document.getElementById(`${pane.id}-ticker-sym`);
            const nameEl = document.getElementById(`${pane.id}-ticker-name`);
            const priceEl = document.getElementById(`${pane.id}-ticker-price`);
            const changeEl = document.getElementById(`${pane.id}-ticker-change`);
            const volEl = document.getElementById(`${pane.id}-ticker-vol`);
            const sigEl = document.getElementById(`${pane.id}-ticker-sig`);
            const tickerBar = document.getElementById(`${pane.id}-ticker`);

            sym.textContent = pane.symbol;
            if (nameEl) {
                nameEl.textContent = pane.companyName ? `— ${pane.companyName}` : '';
            }
            priceEl.textContent = formatPrice(price);

            if (change !== 0) {
                const sign = change > 0 ? '+' : '';
                changeEl.textContent = `${sign}${change.toFixed(4)} (${sign}${changePct.toFixed(2)}%)`;
                changeEl.className = `ticker-change ${change > 0 ? 'positive' : 'negative'}`;

                // Flash animation
                tickerBar.classList.remove('flash-green', 'flash-red');
                void tickerBar.offsetWidth; // force reflow
                tickerBar.classList.add(change > 0 ? 'flash-green' : 'flash-red');
                setTimeout(() => tickerBar.classList.remove('flash-green', 'flash-red'), 600);
            }

            if (volume) {
                volEl.textContent = `Vol: ${formatVolume(volume)}`;
            }

            // Update Top Header Recommendation Signal Badge
            const headerSigEl = document.getElementById(`${pane.id}-header-sig`);
            if (headerSigEl && pane.candles) {
                const sig = computeSignal(pane);
                headerSigEl.textContent = sig.text;
                headerSigEl.className = `ticker-signal ${sig.class}`;
                headerSigEl.style.cursor = 'pointer';
                headerSigEl.title = `Click to view plain-text analysis breakdown for ${pane.symbol}`;
                headerSigEl.onclick = () => openSignalModal(pane, sig);
            }
        }

        function openSignalModal(pane, sig) {
            const modal = document.getElementById('signal-modal');
            const stockEl = document.getElementById('signal-modal-stock');
            const priceEl = document.getElementById('signal-modal-price');
            const badgeEl = document.getElementById('signal-modal-badge');
            const summaryEl = document.getElementById('signal-modal-summary');
            const posEl = document.getElementById('signal-modal-positives');
            const negEl = document.getElementById('signal-modal-negatives');

            if (!modal) return;

            stockEl.textContent = `${pane.symbol}${pane.companyName ? ' — ' + pane.companyName : ''}`;
            priceEl.textContent = `Current Price: ${formatPrice(pane.lastPrice || (pane.candles && pane.candles.length ? pane.candles[pane.candles.length - 1].close : 0))}`;
            badgeEl.textContent = sig.text;
            badgeEl.className = `ticker-signal ${sig.class}`;

            let summaryText = '';
            if (sig.rating === 'STRONG BUY' || sig.rating === 'BUY') {
                summaryText = `⚡ AGGRESSIVE 5–10 YEAR OUTLOOK: ${pane.symbol} is recommended as ${sig.rating} with a composite growth score of +${sig.score}. Tailored for an aggressive investor with a 5-10 year horizon, this asset demonstrates high multi-year compounding potential (PEG growth valuation, forward earnings acceleration, strong profit margins) and structural macro trend support.`;
            } else if (sig.rating === 'STRONG SELL' || sig.rating === 'SELL') {
                summaryText = `⚠️ AGGRESSIVE 5–10 YEAR OUTLOOK: ${pane.symbol} is recommended as ${sig.rating} with a composite score of ${sig.score}. Even for a multi-year horizon, cash burn, negative EPS, or structural macro downtrends present elevated long-term risks.`;
            } else {
                summaryText = `⚖️ AGGRESSIVE 5–10 YEAR OUTLOOK: ${pane.symbol} is currently rated NEUTRAL with a composite score of ${sig.score}. Growth catalysts and risk factors are balanced; consider dollar-cost averaging (DCA) on structural dips.`;
            }
            summaryEl.textContent = summaryText;

            // Render Positives
            if (sig.positives && sig.positives.length > 0) {
                posEl.innerHTML = sig.positives.map(p => `
                    <div class="signal-factor-item positive">
                        <span style="color: #10b981; font-weight: 700;">✓</span>
                        <span>${p}</span>
                    </div>
                `).join('');
            } else {
                posEl.innerHTML = `<div class="signal-factor-item" style="color: var(--text-muted);">No major positive factors identified at this time.</div>`;
            }

            // Render Negatives
            if (sig.negatives && sig.negatives.length > 0) {
                negEl.innerHTML = sig.negatives.map(n => `
                    <div class="signal-factor-item negative">
                        <span style="color: #ef4444; font-weight: 700;">✕</span>
                        <span>${n}</span>
                    </div>
                `).join('');
            } else {
                negEl.innerHTML = `<div class="signal-factor-item" style="color: var(--text-muted);">No major risk factors or negative concerns detected.</div>`;
            }

            modal.classList.add('active');
        }

        // ================================================================
        // WEBSOCKET
        // ================================================================

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${location.host}/ws/${clientId}`;

            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('ws-status-dot').classList.add('connected');
                document.getElementById('ws-status-text').textContent = 'Connected';
                // Re-subscribe all panes
                panes.forEach(pane => {
                    if (pane && pane.symbol) wsSubscribe(pane);
                });
            };

            ws.onmessage = (evt) => {
                try {
                    const data = JSON.parse(evt.data);
                    if (data.status) return; // subscription confirmations
                    if (data.error) { console.warn('WS error:', data.error); return; }

                    // Route to correct pane(s)
                    panes.forEach(pane => {
                        if (!pane) return;
                        if (pane.symbol === data.symbol && pane.source === data.source) {
                            handleTick(pane, data);
                        }
                    });
                } catch (e) {
                    console.error('WS message parse error', e);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('ws-status-dot').classList.remove('connected');
                document.getElementById('ws-status-text').textContent = 'Reconnecting…';
                clearTimeout(wsReconnectTimer);
                wsReconnectTimer = setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket error', err);
                ws.close();
            };
        }

        function wsSubscribe(pane) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({
                action: 'subscribe',
                source: pane.source,
                symbol: pane.symbol,
                timeframe: pane.timeframe,
            }));
        }

        function handleTick(pane, data) {
            const price = data.price;
            const change = data.change || 0;
            const changePct = data.change_pct || 0;
            const volume = data.volume || 0;

            // Update ticker bar
            updateTickerBar(pane, price, change, changePct, volume);

            // Evaluate alerts
            checkAlerts(pane, price);

            // Update candle
            if (data.ohlcv) {
                const candle = data.ohlcv;
                // Update or append candle
                const lastCandle = pane.candles.length > 0 ? pane.candles[pane.candles.length - 1] : null;
                
                if (lastCandle && candle.time < lastCandle.time) {
                    return; // Ignore older ticks to prevent lightweight-charts error
                }

                if (lastCandle && lastCandle.time === candle.time) {
                    // Update existing candle
                    lastCandle.open = candle.open;
                    lastCandle.high = candle.high;
                    lastCandle.low = candle.low;
                    lastCandle.close = candle.close;
                    lastCandle.volume = candle.volume;
                } else {
                    pane.candles.push(candle);
                    // Keep max 500 candles
                    if (pane.candles.length > 500) pane.candles.shift();
                }

                pane.candleSeries.update({
                    time: candle.time,
                    open: candle.open,
                    high: candle.high,
                    low: candle.low,
                    close: candle.close,
                });

                pane.volumeSeries.update({
                    time: candle.time,
                    value: candle.volume,
                    color: candle.close >= candle.open
                        ? 'rgba(16, 185, 129, 0.45)' : 'rgba(239, 68, 68, 0.45)',
                });

                // Recalculate indicators on new candle data
                if (pane.activeIndicators.size > 0) {
                    updateIndicators(pane);
                }
            } else if (price) {
                // Just a trade tick — update the last candle's close and volume
                const lastCandle = pane.candles.length > 0 ? pane.candles[pane.candles.length - 1] : null;
                if (lastCandle) {
                    lastCandle.close = price;
                    if (price > lastCandle.high) lastCandle.high = price;
                    if (price < lastCandle.low) lastCandle.low = price;
                    if (volume) lastCandle.volume = (lastCandle.volume || 0) + volume;

                    pane.candleSeries.update({
                        time: lastCandle.time,
                        open: lastCandle.open,
                        high: lastCandle.high,
                        low: lastCandle.low,
                        close: price,
                    });

                    pane.volumeSeries.update({
                        time: lastCandle.time,
                        value: lastCandle.volume,
                        color: price >= lastCandle.open
                            ? 'rgba(16, 185, 129, 0.45)' : 'rgba(239, 68, 68, 0.45)',
                    });
                }
            }

            pane.lastPrice = price;
        }

        // ================================================================
        // GRID MANAGEMENT
        // ================================================================

        async function setChartCount(count) {
            chartCount = count;
            const grid = document.getElementById('chart-grid');
            grid.setAttribute('data-count', count);

            // Update button states
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.count) === count);
            });

            // Unsubscribe existing panes
            panes.forEach(pane => {
                if (pane && pane.symbol && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        action: 'unsubscribe',
                        source: pane.source,
                        symbol: pane.symbol,
                    }));
                }
                // Destroy chart
                if (pane && pane.chart) {
                    try { pane.chart.remove(); } catch(e) {}
                }
                if (pane && pane.rsiChart) {
                    try { pane.rsiChart.remove(); } catch(e) {}
                }
            });
            panes = new Array(count).fill(null);

            // Rebuild panes
            let html = '';
            for (let i = 0; i < count; i++) {
                html += createPaneHTML(i);
            }
            grid.innerHTML = html;

            // Init ALL panes in PARALLEL so one slow source doesn't block others
            await Promise.allSettled(
                Array.from({ length: count }, (_, i) => initPane(i))
            );
        }

        // ================================================================
        // TOAST NOTIFICATIONS & ALERTS
        // ================================================================

        let activeAlertPane = null;
        let activeAlerts = [];

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function playAlertSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (_) {}
        }

        function checkAlerts(pane, price) {
            if (!price || !activeAlerts.length) return;
            activeAlerts.forEach(alert => {
                if (alert.paneId === pane.id && alert.symbol === pane.symbol && !alert.triggered) {
                    if (alert.condition === 'above' && price >= alert.targetPrice) {
                        alert.triggered = true;
                        playAlertSound();
                        showToast(`🚨 ALERT: ${pane.symbol} rose above $${alert.targetPrice} (Current: $${price})`, 'warning');
                    } else if (alert.condition === 'below' && price <= alert.targetPrice) {
                        alert.triggered = true;
                        playAlertSound();
                        showToast(`🚨 ALERT: ${pane.symbol} dropped below $${alert.targetPrice} (Current: $${price})`, 'warning');
                    }
                }
            });
        }

        // Setup Alert Modal listeners
        function setupAlertModal() {
            const modal = document.getElementById('alert-modal');
            const closeBtn = document.getElementById('alert-modal-close');
            const cancelBtn = document.getElementById('alert-modal-cancel');
            const saveBtn = document.getElementById('alert-modal-save');

            const closeModal = () => modal.classList.remove('active');
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    const priceVal = parseFloat(document.getElementById('alert-modal-price').value);
                    const condVal = document.getElementById('alert-modal-condition').value;

                    if (isNaN(priceVal) || !activeAlertPane) {
                        showToast('Please enter a valid target price', 'warning');
                        return;
                    }

                    activeAlerts.push({
                        paneId: activeAlertPane.id,
                        symbol: activeAlertPane.symbol,
                        targetPrice: priceVal,
                        condition: condVal,
                        triggered: false,
                    });

                    // Visual price line indicator for alert
                    if (activeAlertPane.candleSeries) {
                        activeAlertPane.candleSeries.createPriceLine({
                            price: priceVal,
                            color: condVal === 'above' ? '#10b981' : '#ef4444',
                            lineWidth: 1.5,
                            lineStyle: 1,
                            title: `Alert ${condVal === 'above' ? '≥' : '≤'} ${priceVal}`,
                        });
                    }

                    showToast(`Alert set for ${activeAlertPane.symbol} when price ${condVal} $${priceVal}`, 'success');
                    closeModal();
                });
            }

            // Fullscreen Toggle Button
            const fullBtn = document.getElementById('fullscreen-btn');
            if (fullBtn) {
                fullBtn.addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(e => {
                            showToast('Fullscreen mode not allowed', 'warning');
                        });
                        fullBtn.textContent = '⛶ Exit Fullscreen';
                    } else {
                        document.exitFullscreen();
                        fullBtn.textContent = '⛶ Fullscreen';
                    }
                });
            }

            // Setup Signal Breakdown Modal listeners
            const signalModal = document.getElementById('signal-modal');
            const sigClose = document.getElementById('signal-modal-close');
            const sigOk = document.getElementById('signal-modal-ok');
            const closeSigModal = () => signalModal && signalModal.classList.remove('active');
            if (sigClose) sigClose.addEventListener('click', closeSigModal);
            if (sigOk) sigOk.addEventListener('click', closeSigModal);

            // Esc key listener to close modals or restore maximized pane
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                    closeSigModal();
                    document.querySelectorAll('.chart-pane.maximized').forEach(el => {
                        el.classList.remove('maximized');
                        const maxBtn = el.querySelector('.pane-action-btn[id$="-max-btn"]');
                        if (maxBtn) maxBtn.textContent = '⤢ Expand';
                    });
                }
            });
        }

        // Preset Workspaces Map
        const BUILTIN_PRESETS = {
            default_crypto: [
                { source: 'hyperliquid', symbol: 'BTC', timeframe: '5m' },
                { source: 'hyperliquid', symbol: 'ETH', timeframe: '5m' },
            ],
            binance_top: [
                { source: 'binance', symbol: 'BTCUSDT', timeframe: '5m' },
                { source: 'binance', symbol: 'ETHUSDT', timeframe: '5m' },
            ],
            us_tech: [
                { source: 'yahoo_us', symbol: 'GOOGL', timeframe: '1D' },
                { source: 'yahoo_us', symbol: 'AAPL', timeframe: '1D' },
            ],
            india_bluechips: [
                { source: 'yahoo_india', symbol: 'RELIANCE.NS', timeframe: '1D' },
                { source: 'yahoo_india', symbol: 'TCS.NS', timeframe: '1D' },
            ],
        };

        async function loadPreset(presetKey) {
            let configs = BUILTIN_PRESETS[presetKey];
            if (!configs) {
                // Check localStorage for custom saved presets
                try {
                    const saved = JSON.parse(localStorage.getItem('trading_dashboard_presets') || '{}');
                    configs = saved[presetKey];
                } catch (e) {}
            }
            if (!configs || !configs.length) return;

            // Apply configs to DEFAULT_CONFIGS array
            configs.forEach((cfg, idx) => {
                DEFAULT_CONFIGS[idx] = cfg;
            });

            await setChartCount(configs.length);
            showToast(`Loaded workspace preset`, 'success');
        }

        // ================================================================
        // INIT
        // ================================================================

        async function init() {
            setupAlertModal();

            // Chart count buttons
            document.querySelectorAll('.count-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setChartCount(parseInt(btn.dataset.count));
                });
            });

            // Preset select
            const presetSelect = document.getElementById('preset-select');
            if (presetSelect) {
                presetSelect.addEventListener('change', () => {
                    loadPreset(presetSelect.value);
                });
            }

            // Save layout button
            const savePresetBtn = document.getElementById('save-preset-btn');
            if (savePresetBtn) {
                savePresetBtn.addEventListener('click', () => {
                    const name = prompt('Enter a name for this workspace preset:', 'My Workspace');
                    if (!name) return;

                    const currentConfigs = panes.map(p => ({
                        source: p.source,
                        symbol: p.symbol,
                        timeframe: p.timeframe,
                    }));

                    try {
                        const saved = JSON.parse(localStorage.getItem('trading_dashboard_presets') || '{}');
                        const key = 'custom_' + Date.now();
                        saved[key] = currentConfigs;
                        localStorage.setItem('trading_dashboard_presets', JSON.stringify(saved));

                        // Add option to preset dropdown
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.textContent = `⭐ ${name}`;
                        presetSelect.appendChild(opt);
                        presetSelect.value = key;

                        showToast(`Saved layout "${name}" to LocalStorage`, 'success');
                    } catch (e) {
                        showToast(`Failed to save preset`, 'warning');
                    }
                });
            }

            // Pre-load symbols for all sources
            await Promise.all([
                loadSymbols('hyperliquid'),
                loadSymbols('binance'),
                loadSymbols('yahoo_us'),
                loadSymbols('yahoo_india'),
            ]);

            // Start with default count
            await setChartCount(chartCount);

            // Connect WebSocket
            connectWebSocket();
        }

        // Start
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>
